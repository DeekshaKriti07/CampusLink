name: Production checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: campuslink_ci
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password" --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/campuslink_ci
      TEST_DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/campuslink_ci
      JWT_ACCESS_SECRET: ci-only-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run build --prefix backend
      - run: npm run db:migrate --prefix backend
      - run: npm test --prefix backend
      - run: npm audit --prefix frontend
      - run: npm audit --prefix backend
      - run: docker build -t campuslink:ci .
