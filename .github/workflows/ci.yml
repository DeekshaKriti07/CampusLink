name: Production checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: campuslink
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: campuslink_ci
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U campuslink -d campuslink_ci" --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql://campuslink:ci-only-password@127.0.0.1:5432/campuslink_ci
      DIRECT_URL: postgresql://campuslink:ci-only-password@127.0.0.1:5432/campuslink_ci
      TEST_DATABASE_URL: postgresql://campuslink:ci-only-password@127.0.0.1:5432/campuslink_ci
      JWT_ACCESS_SECRET: ci-only-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix backend
      - run: npm run db:migrate --prefix backend
      - run: npm test --prefix backend
      - run: npm audit --prefix frontend
      - run: npm audit --prefix backend
      - run: docker build -t campuslink:ci .
