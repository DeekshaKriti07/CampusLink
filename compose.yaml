# Optional local PostgreSQL + app. Free hosted deployment uses render.yaml + Neon.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://campuslink:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/campuslink?connection_limit=3
      DIRECT_URL: postgresql://campuslink:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/campuslink
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5001}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      AI_PROVIDER: groq
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      AI_TIMEOUT_MS: "60000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: campuslink
      POSTGRES_USER: campuslink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuslink -d campuslink"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
