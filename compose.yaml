services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://campuslink:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@db:3306/campuslink
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5001}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      AI_TIMEOUT_MS: "120000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: campuslink
      MYSQL_USER: campuslink
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
volumes:
  mysql_data:
  ollama_data:
